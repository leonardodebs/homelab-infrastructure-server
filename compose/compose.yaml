name: homelab

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SERVER_IP}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - diun.enable=true

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    labels:
      - diun.enable=true

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SERVER_IP}:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    labels:
      - diun.enable=true

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      APP_URL: "http://${SERVER_IP}:8090"
    ports:
      - "${SERVER_IP}:8090:8090"
    volumes:
      - beszel_data:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s
      retries: 3
    labels:
      - diun.enable=true

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HUB_URL: "http://${SERVER_IP}:8090"
      KEY: "${BESZEL_KEY}"
      TOKEN: "${BESZEL_TOKEN}"
      DISABLE_SSH: "true"
      FILESYSTEM: "dm-0"
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      start_period: 10s
      timeout: 5s
      retries: 3
    labels:
      - diun.enable=true

  homelab-web:
    image: nginx:alpine
    container_name: homelab-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SERVER_IP}:8080:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - diun.enable=true

  diun:
    image: crazymax/diun:latest
    container_name: diun
    hostname: homelab-diun
    command: serve
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
      LOG_JSON: "false"
      DIUN_WATCH_WORKERS: "5"
      DIUN_WATCH_SCHEDULE: "0 4 * * 0"
      DIUN_WATCH_JITTER: "30s"
      DIUN_WATCH_RUNONSTARTUP: "true"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "false"
    volumes:
      - diun_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - diun.enable=true

volumes:
  portainer_data:
  adguard_work:
  adguard_conf:
  uptime_kuma_data:
  beszel_data:
  beszel_agent_data:
  diun_data:
